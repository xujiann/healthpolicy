name: Daily policy update

on:
  schedule:
    # 01:30 Asia/Shanghai every day.
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unattended-policy-publication
  cancel-in-progress: false

jobs:
  update-policies:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test policy update quality rules
        run: node tools/test-policy-update.mjs

      - name: Fetch policy candidates
        run: node tools/update-policies.mjs --draft --max=8 --deadline-ms=420000

      - name: Publish high-confidence official policies
        run: node tools/auto-publish-candidates.mjs --max=20 --timeout-ms=12000

      - name: Rotate official link health checks
        run: node tools/check-policy-links.mjs --max=40 --concurrency=8 --timeout-ms=8000

      - name: Build reviewed data and review queue
        run: |
          node tools/build-policy-artifacts.mjs
          node tools/generate-review-queue.mjs

      - name: Refresh assignment audit
        run: node tools/generate-assignment-audit.mjs

      - name: Verify policy-only site data
        run: node tools/verify-policy-site.mjs

      - name: Publish verified data to the default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy-update-log.json policy-lifecycle policy-reviewed.js policy-materials.js policy-governance.js policy-review-queue.md policy-assignment-audit.csv
          if git diff --cached --quiet; then
            echo "No policy or governance updates."
          else
            git commit -m "Publish verified policy updates"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
