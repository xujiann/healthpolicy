name: Daily policy update

on:
  schedule:
    # 01:30 Asia/Shanghai every day.
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-policies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test policy update quality rules
        run: node tools/test-policy-update.mjs

      - name: Fetch policy candidates (draft only)
        run: node tools/update-policies.mjs --draft --max=8 --deadline-ms=420000

      - name: Rotate official link health checks
        run: node tools/check-policy-links.mjs --max=40 --concurrency=8 --timeout-ms=8000

      - name: Build reviewed data and review queue
        run: |
          node tools/build-policy-artifacts.mjs
          node tools/generate-review-queue.mjs

      - name: Refresh assignment audit
        run: node tools/generate-assignment-audit.mjs

      - name: Verify policy-only site data
        run: node tools/verify-policy-site.mjs

      - name: Open or update candidate review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policy-update-log.json policy-lifecycle/candidates.json policy-lifecycle/source-health.json policy-lifecycle/link-health.json policy-governance.js policy-review-queue.md
          if git diff --cached --quiet; then
            echo "No candidate updates."
          else
            git fetch origin automation/policy-candidates:refs/remotes/origin/automation/policy-candidates || true
            git commit -m "Daily policy candidate review"
            git push origin HEAD:automation/policy-candidates --force-with-lease
            if gh pr view automation/policy-candidates --json number >/dev/null 2>&1; then
              echo "Candidate review pull request updated."
            else
              gh pr create --base "${GITHUB_REF_NAME}" --head automation/policy-candidates --title "每日政策候选审核" --body-file policy-review-queue.md
            fi
          fi
